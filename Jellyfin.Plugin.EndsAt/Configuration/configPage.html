<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Ends At</title></head>
<body>
<div id="EndsAtConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox">
  <div data-role="content"><div class="content-primary"><form id="EndsAtConfigForm">
    <h2 class="sectionTitle">Ends At</h2>
    <p>Shows a local-time finishing badge and an <em>Ends by</em> filter in movie and series grids. No companion plugin is required.</p>
    <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label"><input id="ShowPosterBadges" type="checkbox" is="emby-checkbox"><span>Show “Ends @” badges</span></label><div class="fieldDescription">Enabled by default. Each viewer can also hide badges with the control in the web client.</div></div>
    <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label"><input id="IncludeSeries" type="checkbox" is="emby-checkbox"><span>Include TV series</span></label><div class="fieldDescription">Series use the median runtime of their available episodes.</div></div>
    <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
  </form></div></div>
  <script>
  (function () {
    var id = '78c8a3ea-5b5e-4ba5-8f7c-5e951b48b0ba';
    var page = document.querySelector('#EndsAtConfigPage');
    page.addEventListener('pageshow', function () { Dashboard.showLoadingMsg(); ApiClient.getPluginConfiguration(id).then(function (c) { document.querySelector('#ShowPosterBadges').checked = c.ShowPosterBadges; document.querySelector('#IncludeSeries').checked = c.IncludeSeries; Dashboard.hideLoadingMsg(); }); });
    document.querySelector('#EndsAtConfigForm').addEventListener('submit', function (e) { e.preventDefault(); Dashboard.showLoadingMsg(); ApiClient.getPluginConfiguration(id).then(function (c) { c.ShowPosterBadges = document.querySelector('#ShowPosterBadges').checked; c.IncludeSeries = document.querySelector('#IncludeSeries').checked; return ApiClient.updatePluginConfiguration(id, c); }).then(Dashboard.processPluginConfigurationUpdateResult); });
  }());
  </script>
</div>
</body>
</html>
